name = "site-factory-worker"
main = "src/index.js"
compatibility_date = "2024-01-01"
workers_dev = true

routes = [
  { pattern = "*.painelbvt.com.br/*", zone_name = "painelbvt.com.br" },
  { pattern = "*.painelbvt.com.br", zone_name = "painelbvt.com.br" },
  { pattern = "*.painelgsw.com.br/*", zone_name = "painelgsw.com.br" },
  { pattern = "*.painelgsw.com.br", zone_name = "painelgsw.com.br" },
  { pattern = "*.vivaras.com.br/*", zone_name = "vivaras.com.br" },
  { pattern = "*.vivaras.com.br", zone_name = "vivaras.com.br" }
]

[vars]
ALLOWED_DOMAINS = '["painelbvt.com.br","painelgsw.com.br","vivaras.com.br","pages.dev","workers.dev"]'
EMAIL_DOMAIN = "painelbvt.com.br"
WORKERS_SUBDOMAIN = "oficialbrasil"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "site-factory-db"
database_id = "7810c353-3340-4310-b9ff-f7d607d7f6fe"

[[kv_namespaces]]
binding = "SITES_KV"
id = "a9eff8e4fd6e40e2adb4c9c82105dfc0"
